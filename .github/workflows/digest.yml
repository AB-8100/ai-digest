name: Generate Weekly AI Digest

on:
  schedule:
    # Runs at 08:00 UTC every Friday
    - cron: '0 8 * * 5'
  workflow_dispatch:

jobs:
  generate-digest:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install anthropic

      - name: Generate and send digest
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RECIPIENT_EMAIL: alexandra.r.brown@outlook.com
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
        run: |
          python digest.py --output-dir digests/

      - name: Commit and push digest
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Actions"
          git add digests/
          git diff --staged --quiet || git commit -m "digest: $(date +'%Y-%m-%d')"
          git push
