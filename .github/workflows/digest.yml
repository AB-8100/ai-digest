name: Generate 4-Weekly AI Digest

on:
  schedule:
    # Runs at 08:00 UTC every Friday — week check below gates actual execution
    - cron: '0 8 * * 5'
  workflow_dispatch:

jobs:
  generate-digest:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check if digest week (every 4 weeks)
        id: week_check
        run: |
          # Runs on ISO weeks 1, 5, 9, 13, 17, 21, 25, 29, 33, 37, 41, 45, 49
          WEEK=$(date +%V | sed 's/^0*//')
          if [ $(( (WEEK - 1) % 4 )) -eq 0 ]; then
            echo "run=true" >> $GITHUB_OUTPUT
            echo "Week $WEEK — digest week. Running."
          else
            echo "run=false" >> $GITHUB_OUTPUT
            echo "Week $WEEK — not a digest week. Skipping."
          fi

      - name: Set up Python
        if: steps.week_check.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        if: steps.week_check.outputs.run == 'true'
        run: |
          pip install anthropic

      - name: Generate and send digest
        if: steps.week_check.outputs.run == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RECIPIENT_EMAIL: alexandra.r.brown@outlook.com
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
        run: |
          python digest.py --output-dir digests/

      - name: Commit and push digest
        if: steps.week_check.outputs.run == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Actions"
          git add digests/
          git diff --staged --quiet || git commit -m "digest: $(date +'%Y-%m-%d')"
          git push
